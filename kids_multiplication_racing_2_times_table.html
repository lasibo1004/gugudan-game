<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>알록달록 구구단 레이서 - 2단 에디션</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Fredoka', 'Nanum Square Round', 'Comic Sans MS', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 850px;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Top Bar Elements */
    .top-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 15;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.25);
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      transition: transform 0.1s;
    }
    .icon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    /* Problem Display Banner */
    #problem-banner {
      position: absolute;
      top: 15px;
      left: 15px;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      border: 4px solid #fff;
      border-radius: 25px;
      padding: 8px 20px;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 6px 0 rgba(0,0,0,0.25);
      z-index: 14;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      pointer-events: none;
      z-index: 10;
    }
    .touch-btn {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.35);
      border: 4px solid #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      color: white;
      pointer-events: auto;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
    }
    .touch-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      background: rgba(255, 255, 255, 0.55);
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      backdrop-filter: blur(6px);
      padding: 20px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 30px;
      color: #facc15;
      text-shadow: 3px 3px 0 #ef4444;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    p {
      margin: 8px 0;
    }
    .btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #991b1b;
      margin-top: 15px;
      transition: all 0.1s;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #991b1b;
    }
    .btn-secondary {
      background: #10b981;
      box-shadow: 0 6px 0 #065f46;
    }
    .btn-secondary:active {
      box-shadow: 0 2px 0 #065f46;
    }
    .leaderboard-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 15px;
      width: 90%;
      max-height: 240px;
      overflow-y: auto;
      margin: 15px 0;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 16px;
    }
    .name-input {
      font-size: 20px;
      padding: 10px;
      border-radius: 12px;
      border: 3px solid #facc15;
      text-align: center;
      width: 80%;
      margin: 10px 0;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Problem Top Display -->
    <div id="problem-banner" class="hidden">
      <span>❓</span>
      <span id="problem-text">2 × 1 = ?</span>
    </div>

    <!-- Top Right Pause & Sound Buttons -->
    <div class="top-controls">
      <div class="icon-btn" id="btn-sound" title="소리 켜기/끄기">🔊</div>
      <div class="icon-btn" id="btn-pause" title="일시정지">⏸️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="touch-controls">
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay">
      <h1>🚗 알록달록 구구단 레이서<br><span style="font-size: 24px; color: #38bdf8;">[ 2단 에디션 ]</span></h1>
      <p style="font-size: 17px; color: #cbd5e1; margin-top: 10px;">
        올바른 정답 숫자를 향해 차선을 변경하세요!<br>정답을 차례대로 맞추면 피버타임! ⭐
      </p>
      <button class="btn" id="btn-start">게임 시작!</button>
      <button class="btn btn-secondary" id="btn-view-leaderboard">🏆 랭킹 보기</button>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-screen" class="overlay hidden">
      <h1>⏸️ 일시 정지</h1>
      <p style="font-size: 18px; color: #cbd5e1;">잠시 쉬는 중입니다.</p>
      <button class="btn" id="btn-resume">계속하기</button>
      <button class="btn btn-secondary" id="btn-quit" style="margin-top: 15px;">처음으로</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <h1 style="color: #f87171;">게임 오버!</h1>
      <p id="final-score" style="font-size: 26px; color: #facc15; font-weight: bold;">점수: 0점</p>
      <p id="final-stats" style="font-size: 16px; color: #cbd5e1;">맞춘 문제: 0개</p>
      
      <div id="rank-submit-box" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <p style="font-size: 16px; color: #38bdf8; margin-top: 10px;">🏆 명예의 전당에 이름을 남겨보세요!</p>
        <input type="text" id="player-name" class="name-input" placeholder="이름 입력" maxlength="8">
        <button class="btn" id="btn-submit-score">점수 등록하기</button>
      </div>

      <button class="btn btn-secondary" id="btn-restart" style="margin-top:15px;">다시 하기</button>
    </div>

    <!-- Leaderboard Overlay -->
    <div id="leaderboard-screen" class="overlay hidden">
      <h1>🏆 명예의 전당 TOP 10</h1>
      <div class="leaderboard-box" id="leaderboard-list"></div>
      <button class="btn" id="btn-close-leaderboard">닫기</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Audio Context & Sound Synthesizer (No External Files)
  let audioCtx = null;
  let soundMuted = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(type) {
    if (soundMuted || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(160, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'fever') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        osc.frequency.setValueAtTime(1046.50, now + 0.24);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    } catch(e) {}
  }

  // Toggle Sound Button
  document.getElementById('btn-sound').addEventListener('click', () => {
    soundMuted = !soundMuted;
    document.getElementById('btn-sound').textContent = soundMuted ? '🔇' : '🔊';
  });

  // Game States
  let gameRunning = false;
  let isPaused = false;
  let score = 0;
  let correctCount = 0;
  let lives = 3;
  let roadOffset = 0;
  let streak = 0;
  let feverTimer = 0;

  // Multiplication Problem Data
  let currentMultiplier = 1; // 2 x multiplier
  let currentAnswer = 2;
  let choiceGates = []; // Answers spawned on lanes
  let gateSpawnTimer = 0;

  // Player Car (Positioned on 3 Lanes: 0=Left, 1=Middle, 2=Right)
  const player = {
    lane: 1, // Start at middle
    targetX: 0,
    x: 0,
    y: 0,
    width: 52,
    height: 80,
    color: '#ff4757',
    invulnerableTimer: 0
  };

  let particles = [];
  let floatingTexts = [];

  // Default Leaderboard
  let leaderboard = JSON.parse(localStorage.getItem('kids_gugudan_scores')) || [
    { name: "구구단천재", score: 1200 },
    { name: "번개레이서", score: 850 },
    { name: "스피드왕", score: 500 }
  ];

  function saveScores() {
    localStorage.setItem('kids_gugudan_scores', JSON.stringify(leaderboard));
  }

  // Generate a new 2 Times Table Question
  function generateQuestion() {
    // Pick multiplier between 1 and 9
    currentMultiplier = Math.floor(Math.random() * 9) + 1;
    currentAnswer = 2 * currentMultiplier;
    document.getElementById('problem-text').textContent = `2 × ${currentMultiplier} = ?`;
  }

  // Spawn Answer Gates on 3 Lanes
  function spawnChoiceGates() {
    const roadWidth = canvas.width * 0.78;
    const laneWidth = roadWidth / 3;
    const roadX = (canvas.width - roadWidth) / 2;

    const correctLane = Math.floor(Math.random() * 3);
    const answers = [];

    // Generate wrong answers that are plausible multiples of 2 or nearby numbers
    const usedAnswers = new Set([currentAnswer]);

    for (let i = 0; i < 3; i++) {
      if (i === correctLane) {
        answers.push(currentAnswer);
      } else {
        let wrong;
        let attempts = 0;
        do {
          const delta = (Math.floor(Math.random() * 5) - 2) * 2; // ±2, ±4, etc.
          wrong = currentAnswer + delta;
          if (wrong <= 0 || wrong > 25) wrong = Math.floor(Math.random() * 9 + 1) * 2;
          attempts++;
        } while (usedAnswers.has(wrong) && attempts < 20);
        
        usedAnswers.add(wrong);
        answers.push(wrong);
      }
    }

    choiceGates = [];
    for (let i = 0; i < 3; i++) {
      choiceGates.push({
        lane: i,
        x: roadX + i * laneWidth + laneWidth / 2,
        y: -100,
        val: answers[i],
        isCorrect: answers[i] === currentAnswer,
        passed: false
      });
    }
  }

  function getLaneCenterX(laneIndex) {
    const roadWidth = canvas.width * 0.78;
    const laneWidth = roadWidth / 3;
    const roadX = (canvas.width - roadWidth) / 2;
    return roadX + laneIndex * laneWidth + laneWidth / 2;
  }

  function addParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        radius: 4 + Math.random() * 5,
        color: color,
        life: 25 + Math.random() * 15
      });
    }
  }

  function addFloatingText(text, x, y, color = '#facc15') {
    floatingTexts.push({
      text: text,
      x: x,
      y: y,
      vy: -2,
      opacity: 1.0,
      color: color
    });
  }

  function renderLeaderboard() {
    const listContainer = document.getElementById('leaderboard-list');
    listContainer.innerHTML = '';
    
    // Sort scores descending
    leaderboard.sort((a, b) => b.score - a.score);
    const top10 = leaderboard.slice(0, 10);

    if (top10.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; padding:10px; color:#aaa;">등록된 점수가 없습니다.</div>';
      return;
    }

    top10.forEach((entry, idx) => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';
      let badge = `${idx + 1}등`;
      if (idx === 0) badge = '🥇 1등';
      if (idx === 1) badge = '🥈 2등';
      if (idx === 2) badge = '🥉 3등';

      item.innerHTML = `
        <span style="font-weight: bold; color: #facc15;">${badge}</span>
        <span>${entry.name}</span>
        <span style="color: #38bdf8;">${entry.score}점</span>
      `;
      listContainer.appendChild(item);
    });
  }

  function startGame() {
    initAudio();
    gameRunning = true;
    isPaused = false;
    score = 0;
    correctCount = 0;
    lives = 3;
    streak = 0;
    feverTimer = 0;
    roadOffset = 0;
    particles = [];
    floatingTexts = [];

    player.lane = 1;
    player.y = canvas.height - 130;
    player.targetX = getLaneCenterX(1) - player.width / 2;
    player.x = player.targetX;
    player.invulnerableTimer = 0;

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('pause-screen').classList.add('hidden');
    document.getElementById('leaderboard-screen').classList.add('hidden');
    document.getElementById('problem-banner').classList.remove('hidden');

    generateQuestion();
    spawnChoiceGates();
  }

  function pauseGame() {
    if (!gameRunning) return;
    isPaused = true;
    document.getElementById('pause-screen').classList.remove('hidden');
  }

  function resumeGame() {
    isPaused = false;
    document.getElementById('pause-screen').classList.add('hidden');
  }

  function gameOver() {
    gameRunning = false;
    document.getElementById('problem-banner').classList.add('hidden');
    document.getElementById('final-score').textContent = `최종 점수: ${score}점`;
    document.getElementById('final-stats').textContent = `맞춘 구구단: ${correctCount}개!`;
    document.getElementById('gameover-screen').classList.remove('hidden');
  }

  function updateGameLogic() {
    if (!gameRunning || isPaused) return;

    // Smooth movement towards target lane X
    player.targetX = getLaneCenterX(player.lane) - player.width / 2;
    player.x += (player.targetX - player.x) * 0.25;

    // Road animation speed
    const currentSpeed = feverTimer > 0 ? 5.5 : 3.5;
    roadOffset += currentSpeed;

    if (feverTimer > 0) feverTimer--;
    if (player.invulnerableTimer > 0) player.invulnerableTimer--;

    // Move Gates down
    if (choiceGates.length > 0) {
      let gatesPassed = false;

      choiceGates.forEach(gate => {
        gate.y += currentSpeed;

        // Check collision with player
        const gateRadius = 36;
        const gateX = gate.x;
        const gateY = gate.y;

        const playerCenterX = player.x + player.width / 2;
        const playerCenterY = player.y + player.height / 2;

        const dist = Math.hypot(playerCenterX - gateX, playerCenterY - gateY);

        if (!gate.passed && dist < gateRadius + 22) {
          gate.passed = true;
          gatesPassed = true;

          if (gate.isCorrect) {
            // Correct Answer!
            score += (feverTimer > 0 ? 200 : 100);
            correctCount++;
            streak++;

            playSound('correct');
            addParticles(gateX, gateY, '#38bdf8', 20);
            addParticles(gateX, gateY, '#facc15', 15);
            addFloatingText('+100 정답!', gateX, gateY - 20, '#facc15');

            // Trigger Fever Mode on 3 streak
            if (streak >= 3) {
              feverTimer = 180; // 3 seconds
              streak = 0;
              playSound('fever');
              addFloatingText('🔥 피버 타임! 🔥', canvas.width / 2, canvas.height / 2, '#ef4444');
            }
          } else {
            // Wrong Answer!
            if (player.invulnerableTimer <= 0) {
              lives--;
              streak = 0;
              player.invulnerableTimer = 45;
              playSound('wrong');
              addParticles(gateX, gateY, '#ef4444', 25);
              addFloatingText('❌ 오답!', gateX, gateY - 20, '#ef4444');

              if (lives <= 0) {
                gameOver();
                return;
              }
            }
          }
        }

        if (gate.y > canvas.height + 60) {
          gatesPassed = true;
        }
      });

      // If gates went past without hit or answered, generate next problem
      if (gatesPassed && choiceGates.every(g => g.passed || g.y > canvas.height + 50)) {
        choiceGates = [];
        setTimeout(() => {
          if (gameRunning && !isPaused) {
            generateQuestion();
            spawnChoiceGates();
          }
        }, 300);
      }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Update Floating Text
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy;
      ft.opacity -= 0.02;
      if (ft.opacity <= 0) floatingTexts.splice(i, 1);
    }
  }

  function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background Grass
    ctx.fillStyle = feverTimer > 0 ? '#1e1b4b' : '#064e3b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Road Dimensions
    const roadWidth = canvas.width * 0.78;
    const roadX = (canvas.width - roadWidth) / 2;
    const laneWidth = roadWidth / 3;

    // Asphalt Road
    ctx.fillStyle = feverTimer > 0 ? '#312e81' : '#1e293b';
    ctx.fillRect(roadX, 0, roadWidth, canvas.height);

    // Road Borders (Curbs)
    const curbWidth = 10;
    const curbHeight = 30;
    for (let y = -curbHeight + (roadOffset % (curbHeight * 2)); y < canvas.height; y += curbHeight * 2) {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(roadX - curbWidth, y, curbWidth, curbHeight);
      ctx.fillRect(roadX + roadWidth, y, curbWidth, curbHeight);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(roadX - curbWidth, y + curbHeight, curbWidth, curbHeight);
      ctx.fillRect(roadX + roadWidth, y + curbHeight, curbWidth, curbHeight);
    }

    // Lane Dividers (Dashed lines)
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 4;
    ctx.setLineDash([25, 20]);
    ctx.lineDashOffset = -roadOffset;

    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(roadX + i * laneWidth, 0);
      ctx.lineTo(roadX + i * laneWidth, canvas.height);
      ctx.stroke();
    }
    ctx.setLineDash([]); // Reset dash

    // Draw Choice Gates (Bubble / Number Orbs)
    choiceGates.forEach(gate => {
      if (gate.passed) return;

      const gateRadius = 34;

      // Glow Effect
      ctx.save();
      ctx.shadowBlur = 15;
      ctx.shadowColor = feverTimer > 0 ? '#facc15' : '#38bdf8';

      // Circle Background
      ctx.beginPath();
      ctx.arc(gate.x, gate.y, gateRadius, 0, Math.PI * 2);
      ctx.fillStyle = feverTimer > 0 ? '#f59e0b' : '#0284c7';
      ctx.fill();

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();

      // Number Text
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 28px "Fredoka", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(gate.val, gate.x, gate.y + 2);
    });

    // Draw Player Car
    if (player.invulnerableTimer % 6 < 3) {
      ctx.save();
      ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

      // Car Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-player.width / 2 + 4, -player.height / 2 + 8, player.width, player.height);

      // Car Body
      ctx.fillStyle = feverTimer > 0 ? '#facc15' : player.color;
      ctx.beginPath();
      ctx.roundRect(-player.width / 2, -player.height / 2, player.width, player.height, 12);
      ctx.fill();

      // Roof / Windshield
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(-player.width / 2 + 6, -player.height / 2 + 18, player.width - 12, 28, 6);
      ctx.fill();

      // Headlights
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(-player.width / 2 + 6, -player.height / 2 + 2, 10, 6);
      ctx.fillRect(player.width / 2 - 16, -player.height / 2 + 2, 10, 6);

      // Fever Aura
      if (feverTimer > 0) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.strokeRect(-player.width / 2 - 4, -player.height / 2 - 4, player.width + 8, player.height + 8);
      }

      ctx.restore();
    }

    // Draw Particles
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw Floating Text
    floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.opacity);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 22px "Fredoka", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });

    // HUD: Score & Lives
    if (gameRunning && !isPaused) {
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 20px "Fredoka", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`점수: ${score}`, 20, canvas.height - 25);

      // Lives Display (💖)
      ctx.textAlign = 'right';
      let hearts = '';
      for (let i = 0; i < lives; i++) hearts += '💖';
      ctx.fillText(hearts, canvas.width - 20, canvas.height - 25);

      // Streak Indicator
      if (streak > 0) {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 16px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`연속 정답 🔥 ${streak} / 3`, canvas.width / 2, canvas.height - 25);
      }
    }
  }

  function gameLoop() {
    updateGameLogic();
    drawGame();
    requestAnimationFrame(gameLoop);
  }

  // Lane Controls
  function moveLeft() {
    if (player.lane > 0) {
      player.lane--;
      playSound('click');
    }
  }

  function moveRight() {
    if (player.lane < 2) {
      player.lane++;
      playSound('click');
    }
  }

  // Touch Button Controls
  document.getElementById('btn-left').addEventListener('click', moveLeft);
  document.getElementById('btn-right').addEventListener('click', moveRight);

  // Keyboard Controls
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      moveLeft();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      moveRight();
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (gameRunning) {
        isPaused ? resumeGame() : pauseGame();
      }
    }
  });

  // UI Event Handlers
  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-restart').addEventListener('click', startGame);
  document.getElementById('btn-pause').addEventListener('click', pauseGame);
  document.getElementById('btn-resume').addEventListener('click', resumeGame);
  
  document.getElementById('btn-quit').addEventListener('click', () => {
    gameRunning = false;
    isPaused = false;
    document.getElementById('pause-screen').classList.add('hidden');
    document.getElementById('problem-banner').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  });

  document.getElementById('btn-view-leaderboard').addEventListener('click', () => {
    renderLeaderboard();
    document.getElementById('leaderboard-screen').classList.remove('hidden');
  });

  document.getElementById('btn-close-leaderboard').addEventListener('click', () => {
    document.getElementById('leaderboard-screen').classList.add('hidden');
    if (!gameRunning) {
      document.getElementById('start-screen').classList.remove('hidden');
    }
  });

  document.getElementById('btn-submit-score').addEventListener('click', () => {
    const nameInput = document.getElementById('player-name');
    const playerName = nameInput.value.trim() || '구구단레이서';

    leaderboard.push({ name: playerName, score: score });
    saveScores();
    nameInput.value = '';

    renderLeaderboard();
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('leaderboard-screen').classList.remove('hidden');
  });

  // Start Animation Loop
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
